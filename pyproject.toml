[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-qnn-pipeline"
version = "0.1.0"
description = "Modular LangGraph pipeline for Qualcomm QNN/QAIRT model conversion and AI Hub profiling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
dependencies = [
  "langgraph>=0.2.50",
  "langchain-core>=0.3.0",
  "PyYAML>=6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
agent = [
  "langchain-openai>=0.3.0",
]
qaihub = [
  "qai-hub>=0.35.0",
]

[project.scripts]
edge-qnn-pipeline = "edge_qnn_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
