# Example: Samsung Galaxy S24 family profile (Snapdragon 8 Gen 3 / SM8650)
# Update paths and API settings before real execution.

dry_run: true
run_dir: runs

model:
  framework: onnx
  model_path: ./models/resnet50.onnx
  model_name: resnet50
  onnx_opset: 17
  input_shape: [1, 3, 224, 224]

  # For PyTorch input, switch framework to "pytorch" and provide command template.
  # pytorch_export_command: >-
  #   python scripts/export_pytorch.py
  #   --input {input_path}
  #   --output {output_onnx}
  #   --opset {opset}
  #   --input-shape {input_shape}

target:
  name: galaxy_s24_family
  soc: SM8650
  device_family: Samsung Galaxy S24 (Family)
  qnn_backend: htp
  htp_soc_id: 43
  htp_arch: v75
  context_binary_name: resnet50.serialized.bin
  backend_extensions_json: ./configs/backend_extensions/s24_htp.json

quantization:
  enabled: true
  scheme: int8_per_channel
  calibration_dataset: ./data/calibration/input_list.txt
  use_per_channel: true
  use_bias_correction: true

qnn:
  sdk_root: ${QNN_SDK_ROOT}
  toolchain: aarch64-android
  output_dir: artifacts
  converter_tool: qnn-onnx-converter
  model_lib_generator_tool: qnn-model-lib-generator
  context_binary_generator_tool: qnn-context-binary-generator
  net_run_tool: qnn-net-run
  extra_converter_args:
    - --preserve_io
  extra_context_args:
    - --profiling_level
    - detailed

aihub:
  mode: mock
  base_url: https://api.example.aihub
  api_key_env: QAI_HUB_API_KEY
  project: edge-optimization
  polling_interval_sec: 15
  timeout_sec: 2400

optimization:
  target_latency_ms: 8.5
  max_iterations: 8
  allow_architecture_tuning: true
  architecture_tuning_command: >-
    python scripts/architecture_tune.py --work-dir {work_dir} --input-shape {input_shape}
  allow_input_resize: true
  min_input_edge: 160

agent:
  enabled: true
  mode: rule_based
  # To use LLM analysis, install langchain-openai and switch mode to openai.
  # model: gpt-4.1-mini
  # temperature: 0.1
  max_tokens: 300
